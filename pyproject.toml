[project]
name = "somajji"
version = "0.1.0"
description = "AI helper for community mental health volunteers (portfolio demo)."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.3.5",
    "langchain-anthropic>=1.7.1",
    "langchain-core>=1.6.2",
    "python-dotenv>=1.2.3",
    "pinecone>=10.0.0",
    "voyageai>=0.5.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests talk to Voyage and Pinecone (a few free tokens, a few reads). They run only on request:
#   uv run pytest -m integration
addopts = "-m 'not integration'"
markers = ["integration: talks to the real Voyage and Pinecone services (needs keys and an ingested index)"]
